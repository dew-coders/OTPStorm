[metadata]
name = otpstorm
version = 2.0.0
description = Multi-Provider OTP Flood Tool
long_description = file: README.md
long_description_content_type = text/markdown
license = Educational Use Only
platforms = any

[options]
packages = find:
python_requires = >=3.8
install_requires =
    requests>=2.25.0
    urllib3>=1.26.0

[options.entry_points]
console_scripts =
    otpstorm = otpstorm.cli:main
